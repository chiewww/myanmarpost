name: Monitor Myanmar Post Prices

on:
  schedule:
    # Run every day at 00:00 UTC
    - cron: "0 0 * * *"

  # Also allow you to run it manually from GitHub
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Myanmar Post
        run: |
          python myanmarpost.py

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet -- myanmarpost_prices.txt; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updated prices
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add myanmarpost_prices.txt

          git commit -m "Update Myanmar Post prices"

          git push
```
