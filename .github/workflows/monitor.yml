name: Monitor Myanmar Post Prices

on:
  schedule:
    # Run once every day at 00:00 UTC
    - cron: "0 0 * * *"

  # Allow manual testing
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Myanmar Post monitor
        run: |
          python myanmarpost.py

      - name: Verify output file
        run: |
          echo "Files in repository:"
          ls -la

          echo ""
          echo "Output file:"
          ls -lh myanmarpost_prices.txt

          echo ""
          echo "First 10 lines:"
          head -10 myanmarpost_prices.txt

      - name: Commit updated prices
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add myanmarpost_prices.txt

          if git diff --cached --quiet; then
            echo "No changes to myanmarpost_prices.txt"
          else
            git commit -m "Update Myanmar Post prices"
            git push
          fi
