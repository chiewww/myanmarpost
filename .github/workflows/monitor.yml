name: Monitor Myanmar Post Prices

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Run Myanmar Post monitor
        run: python monitor.py

      - name: Commit updated price file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add myanmarpost_prices.txt

          if git diff --cached --quiet; then
            echo "No changes to myanmarpost_prices.txt"
          else
            git commit -m "Update Myanmar Post prices"
            git push
          fi
